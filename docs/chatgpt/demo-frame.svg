  <text x="48" y="43" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#202123">ChatGPT</text>
  <rect x="865" y="18" width="365" height="34" rx="17" fill="#edf7f1"/>
  <circle cx="887" cy="35" r="8" fill="#159455"/>
  <text x="905" y="41" font-family="Arial, sans-serif" font-size="16" fill="#176b45">Catalán Propiedades Demo</text>

  <rect x="455" y="105" width="755" height="90" rx="18" fill="#e9e9e7"/>
  <text x="485" y="139" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#222">Consulta</text>
  <text x="485" y="171" font-family="Arial, sans-serif" font-size="18" fill="#222">¿Qué casas hay en venta en San Martín de los Andes</text>
  <text x="485" y="194" font-family="Arial, sans-serif" font-size="18" fill="#222">por menos de 200.000 dólares?</text>

  <rect x="70" y="225" width="1140" height="420" rx="18" fill="#ffffff" stroke="#dededb"/>
  <rect x="102" y="254" width="292" height="38" rx="19" fill="#eef6ff"/>
  <circle cx="126" cy="273" r="9" fill="#2f6fed"/>
  <text x="145" y="279" font-family="Arial, sans-serif" font-size="16" fill="#315eac">Se llamó a la herramienta</text>
  <text x="103" y="329" font-family="Arial, sans-serif" font-size="20" fill="#222">En el catálogo actual de Catalán Propiedades encontré una casa</text>
  <text x="103" y="358" font-family="Arial, sans-serif" font-size="20" fill="#222">en venta en San Martín de los Andes por menos de USD 200.000:</text>
  <rect x="103" y="391" width="1074" height="132" rx="12" fill="#f7faf8" stroke="#cfe5d7"/>
  <text x="132" y="430" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#146c43">USD 180.000 · Centro</text>
  <text x="132" y="466" font-family="Arial, sans-serif" font-size="19" fill="#222">Casa de 3 dormitorios, 1 baño y 230 m².</text>
  <text x="132" y="497" font-family="Arial, sans-serif" font-size="18" fill="#555">“Espacio, confort y naturaleza a minutos del centro”</text>
  <text x="103" y="566" font-family="Arial, sans-serif" font-size="18" fill="#222">La respuesta incluye precio publicado, barrio y enlace directo a la ficha.</text>
  <text x="103" y="601" font-family="Arial, sans-serif" font-size="16" fill="#666">Datos consultados en vivo desde catalanpropiedades.com.ar</text>
  <text x="640" y="686" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#777">Demostración de Catalán Propiedades para ChatGPT</text>

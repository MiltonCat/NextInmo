<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Copo de nieve de invierno Catalan Propiedades">
  <style>
    @keyframes winter-drift {
      0%, 100% { transform: translateY(-10px) rotate(0deg) scale(.78); }
      50% { transform: translateY(10px) rotate(90deg) scale(1.08); }
    }
    .snowflake { animation: winter-drift 1.25s ease-in-out infinite; transform-origin: 32px 32px; }
  </style>
  <rect width="64" height="64" rx="14" fill="#eff9ff"/>
  <path d="M9 52h46" stroke="#bae6fd" stroke-width="5" stroke-linecap="round"/>
  <ellipse cx="32" cy="49" rx="10" ry="2.5" fill="#075985" opacity="0.22"/>
  <g class="snowflake" fill="none" stroke="#0284c7" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M32 18v28M20 25l24 14M20 39l24-14"/>
  </g>
  <circle class="snowflake" cx="32" cy="32" r="3" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Copo de nieve de invierno Catalan Propiedades">
  <style>
    @keyframes winter-drift {
      0% { transform: translateY(-6px) rotate(0deg) scale(.9); }
      50% { transform: translateY(6px) rotate(180deg) scale(1.06); }
      100% { transform: translateY(-6px) rotate(360deg) scale(.9); }
    }
    .snowflake { animation: winter-drift 4.8s ease-in-out infinite; transform-origin: 32px 32px; }
  </style>
